name: Update GitHub profile statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/update-stats.yml'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: graphite-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate custom stats
        env:
          GH_USERNAME: Shivanshu-06
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/overview.svg assets/stats/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh public GitHub stats'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
