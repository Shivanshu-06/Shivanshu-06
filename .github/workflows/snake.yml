name: Generate terracotta and forest contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated GIF
        uses: Platane/snk@v3
        with:
          github_user_name: Shivanshu-06
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=%23C4775C&color_dots=%23F1F5EA,%23C7DDBD,%239BBF94,%236A9A76,%233E7159&color_background=%23FFFCF6

      - name: Publish GIF to output branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
